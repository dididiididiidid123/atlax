<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fbe6"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Deep navy tile -->
  <rect width="512" height="512" rx="112" fill="#0b2545"/>

  <!-- Leaf mark, scaled and moved up to make room for the wordmark -->
  <g transform="translate(256 180) scale(0.7) translate(-256 -256)">
    <g transform="rotate(45 256 256)">
      <path d="M256 420 V 466" stroke="#86efac" stroke-width="12" stroke-linecap="round"/>
      <path fill="url(#leaf)" d="M256 88 C 376 170 376 342 256 424 C 136 342 136 170 256 88 Z"/>
      <path d="M256 130 V 386" stroke="#0b2545" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="256" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="76" letter-spacing="14" fill="#e6fbef">ATLAX</text>
</svg>
