<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081d36"/>
      <stop offset="1" stop-color="#0b2d52"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="100" x2="0" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Faint money and tax hints, placed in the corners with clear space around the letter -->
  <g opacity="0.12" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <!-- Coin, top-left corner -->
    <circle cx="74" cy="74" r="34"/>
    <circle cx="74" cy="74" r="18"/>
    <!-- Document, top-right corner -->
    <rect x="372" y="60" width="84" height="110" rx="12"/>
    <path d="M390 92 H440 M390 114 H440 M390 136 H414"/>
    <!-- Coin, left side -->
    <circle cx="76" cy="350" r="28"/>
    <circle cx="76" cy="350" r="15"/>
    <!-- Coin, bottom-right corner -->
    <circle cx="432" cy="436" r="32"/>
    <circle cx="432" cy="436" r="17"/>
  </g>
  <!-- Faint percent sign, left side -->
  <text x="36" y="256" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="80" fill="#ffffff" opacity="0.10">%</text>

  <!-- Leaf-shaped letter A -->
  <path fill="url(#leaf)" d="
    M256 100
    C 300 146 356 240 356 412
    L 298 412
    C 294 330 282 280 256 238
    C 230 280 218 330 214 412
    L 156 412
    C 156 240 212 146 256 100 Z"/>

  <!-- Crossbar -->
  <path fill="url(#leaf)" d="M196 322 H316 V344 H196 Z"/>

  <!-- Midrib -->
  <path d="M256 150 V 226" stroke="#081d36" stroke-width="10" stroke-linecap="round"/>
</svg>
