<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081d36"/>
      <stop offset="1" stop-color="#0b2d52"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="100" x2="0" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Faint tax and money hints (low opacity, kept behind the letter) -->
  <g opacity="0.12" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <!-- Document -->
    <rect x="352" y="64" width="96" height="124" rx="14"/>
    <path d="M374 102 H426 M374 128 H426 M374 154 H404"/>
    <!-- Coins -->
    <circle cx="72" cy="78" r="34"/>
    <circle cx="72" cy="78" r="18"/>
    <circle cx="442" cy="438" r="36"/>
    <circle cx="442" cy="438" r="19"/>
    <circle cx="66" cy="238" r="24"/>
    <!-- Banknote -->
    <g transform="rotate(-12 96 368)">
      <rect x="40" y="336" width="112" height="64" rx="8"/>
      <circle cx="96" cy="368" r="16"/>
    </g>
  </g>
  <!-- Faint percent sign -->
  <text x="44" y="206" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="96" fill="#ffffff" opacity="0.08">%</text>

  <!-- Leaf-shaped letter A -->
  <path fill="url(#leaf)" d="
    M256 100
    C 300 146 356 240 356 412
    L 298 412
    C 294 330 282 280 256 238
    C 230 280 218 330 214 412
    L 156 412
    C 156 240 212 146 256 100 Z"/>

  <!-- Crossbar -->
  <path fill="url(#leaf)" d="M196 322 H316 V344 H196 Z"/>

  <!-- Midrib -->
  <path d="M256 150 V 226" stroke="#081d36" stroke-width="10" stroke-linecap="round"/>
</svg>
